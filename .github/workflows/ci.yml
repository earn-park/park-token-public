name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read

jobs:
  forge:
    name: Foundry
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.4.0
        with:
          version: stable
      # Pin to the exact Foundry commit documented in docs/AUDIT-SCOPE.md
      # and asserted by docs/BYTECODE-BASELINE.md. Any drift here changes
      # bytecode reproducibility — bump the SHA in source code AND in this
      # workflow in the same PR (per mega-review MR-02 fix).
      - run: foundryup --version "b0a9dd9c"
      - name: Assert Foundry SHA matches baseline
        run: |
          set -euo pipefail
          forge --version
          forge --version | grep -q 'b0a9dd9c' \
            || { echo "::error::Foundry SHA drift — expected b0a9dd9c, got $(forge --version)"; exit 1; }
      - run: forge fmt --check
      - run: forge build --offline
      - run: forge test --offline -vv

  ts:
    name: TypeScript
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.20.0'
      - run: npm ci --ignore-scripts
      - run: npm run deps:check-exact
      - run: npm run lint
      - run: npx tsc --noEmit
      # Compile Hardhat artifacts before hh:test runs. The TS test path
      # (build-bsc-calldata.ts + deploy-bsc.ts) loads compiled-artifact
      # JSON files from artifacts/, which is .gitignore'd. Without this
      # step, hh:test partially fails on a clean clone (audit finding H-02).
      - run: npx hardhat compile
      - run: npm run hh:test

  repro:
    name: Bytecode reproducibility (Foundry + Hardhat)
    needs: [forge, ts]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.4.0
        with:
          version: stable
      - run: foundryup --version "b0a9dd9c"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.20.0'
      # scripts/repro.sh:
      #   1. asserts forge --version SHA matches b0a9dd9c
      #   2. cleans out/ + cache_hardhat/ + artifacts/
      #   3. compiles via hardhat + forge
      #   4. computes deployedBytecode keccak256 for ParkToken / ParkERC1967Proxy /
      #      ParkTimelockController in BOTH artifact families
      #   5. asserts each of the 6 hashes matches docs/BYTECODE-BASELINE.md
      #   exits non-zero on any drift. CertiK pre-audit M-02 fix.
      - name: Run scripts/repro.sh (asserts 6 baseline rows)
        run: bash scripts/repro.sh
